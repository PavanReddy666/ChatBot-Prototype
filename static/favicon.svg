      <stop offset="0%" stop-color="#1E1E1E" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
